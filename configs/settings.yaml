qdrant:
  collection_name: "attack_chunks"
  distance: "cosine"
  top_k: 12

chunking:
  chunk_size: 1200
  overlap: 150

models:
  embed_dim: 384
  chat_model: "llama-3.3-70b-versatile"
  embed_model: "all-MiniLM-L6-v2"

layer1:
  min_evidence_score: 0.40
  min_evidence_chunks: 2
  max_retries: 1
  temperature: 0.1

  retrieval_eval_temperature: 0.0
  answer_eval_temperature: 0.0

  min_relevance_score: 0.65
  min_sufficiency_score: 0.65
  min_groundedness_score: 0.75
  min_completeness_score: 0.70

  max_revision_rounds: 1

layer2:
  max_sub_questions: 5
  temperature: 0.2